<!DOCTYPE html>
<!-- The ink spine is fixed dark (spec §6.1), not a user preference. Setting
     the class here rather than from React avoids a white flash before hydration. -->
<html lang="en" class="ion-palette-dark">
  <head>
    <meta charset="utf-8" />
    <title>MuseumLover</title>
    <meta name="theme-color" content="#14100E" />

    <base href="/" />

    <meta name="color-scheme" content="dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    
    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MuseumLover" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
